[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teamai"
version = "0.1.0"
description = "Détection et interprétation d'anomalies dans les logs HDFS (projet NLP 2)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Socle commun : chargement des données, baseline, métriques
data = ["pandas>=2.0", "numpy>=1.26", "scikit-learn>=1.4", "matplotlib>=3.8", "jupyter"]
# Tests automatisés (lancés aussi par GitHub Actions à chaque PR) : léger, sans torch ni poids de modèle
dev = ["pytest>=8.0", "pyyaml>=6.0", "pandas>=2.0", "numpy>=1.26", "psutil>=5.9", "rank-bm25>=0.2"]
# Volet A : entraînement du BiLSTM et export navigateur
volet_a = ["torch>=2.2", "onnx>=1.16", "onnxruntime>=1.18"]
# Première inférence seule, sans les composants RAG/Gradio/PEFT.
slm = ["torch>=2.2", "transformers>=5.6.2,<6", "pyyaml>=6.0", "psutil>=5.9", "hf-xet>=1.0"]
# Volet B : SLM, LoRA, RAG, interface locale (bitsandbytes : GPU NVIDIA uniquement)
volet_b = [
    "torch>=2.2", "transformers>=5.6.2,<6", "peft>=0.18.1", "accelerate>=1.12.0", "datasets>=2.20",
    "sentence-transformers>=3.0", "faiss-cpu>=1.8", "rank-bm25>=0.2", "gradio>=4.40",
    "pyyaml>=6.0", "psutil>=5.9",
]
# Essai LoRA (SCRUM-29) ; sur GPU NVIDIA, installer PyTorch CUDA d'abord, et bitsandbytes pour --qlora
lora = ["torch==2.9.1", "transformers==5.6.2", "peft==0.18.1", "accelerate==1.12.0", "bitsandbytes==0.49.2", "safetensors==0.7.0", "pyyaml==6.0.3", "psutil==7.2.2"]
# Version 4 bits (GGUF) sur CPU — roue précompilée :
# pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
volet_b_gguf = ["llama-cpp-python==0.3.36", "gguf>=0.19", "sentencepiece>=0.2", "huggingface-hub>=0.25", "pyyaml>=6.0", "psutil>=5.9", "pandas>=2.0"]

[tool.setuptools.packages.find]
include = ["teamai*", "data*", "eval*", "volet_a*", "volet_b*"]

[tool.setuptools.package-data]
"volet_b.slm" = ["configs/*.yaml"]
"volet_b.slm.v16" = ["glossaire.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["full_data: nécessite le corpus complet data/raw/HDFS_v1 (sauté s'il est absent)"]
