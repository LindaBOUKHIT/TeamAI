# SCRUM-29 — Essai LoRA court : faisabilité matérielle, pas qualité.
# Poids HF d'entraînement ; generation.yaml désigne séparément le GGUF officiel.
base_model:
  model_id: google/gemma-4-E4B-it-qat-q4_0-unquantized
  revision: 476025a01dbf99361c062bbeca3d6a76bb4c4566
  architecture: Gemma4ForCausalLM
  dtype: float16
data: volet_b/annotations/seed_alain.jsonl
adapter_dir: volet_b/slm/adapters/essai   # non versionné (.gitignore)
seed: 42

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, v_proj]
  bias: none
  use_dora: false
  modules_to_save: null

training:
  steps: 30               # « quelques dizaines de pas »
  batch_size: 1
  fp16: true
  bf16: false
  learning_rate: 2.0e-4
  max_tokens: 3072        # un exemple plus long est refusé, jamais tronqué silencieusement
  gradient_checkpointing: true
  torch_threads: 12
